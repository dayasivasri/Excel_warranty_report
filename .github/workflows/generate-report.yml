
name: Generate Asset Warranty Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check input file
        run: |
          ls -la
          test -f Asset_Inventory.xlsx

      - name: Generate warranty report
        run: python asset_expiry_tracker.py

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        with:
          name: Asset-Warranty-Report
          path: Asset_Warranty_Report.xlsx
          if-no-files-found: error
